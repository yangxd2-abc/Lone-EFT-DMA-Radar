<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Overview Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0f13;
      --bar: #171b21;
      --panel: #1a2027;
      --panel-2: #202832;
      --line: #33404d;
      --text: #e9eef4;
      --muted: #94a3b2;
      --accent: #45b9c7;
      --local: #49d466;
      --team: #72f071;
      --pmc: #ef5350;
      --scav: #ecd94d;
      --boss: #f05be7;
      --loot: #f0f4f8;
      --valuable: #40d6d1;
      --extract: #74a7ff;
      --hazard: #ff7b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.35 "Segoe UI", Arial, sans-serif;
    }
    .menu {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: rgba(23, 27, 33, .96);
      border-bottom: 1px solid var(--line);
    }
    button, .menu-link {
      height: 24px;
      border: 1px solid #3a4654;
      border-radius: 5px;
      background: #222a34;
      color: var(--text);
      padding: 0 10px;
      font: inherit;
      cursor: pointer;
    }
    button:hover, .menu-link:hover { border-color: var(--accent); }
    button.active { background: #256733; border-color: #42c65b; }
    .spacer { flex: 1; }
    .workspace {
      position: relative;
      height: calc(100vh - 32px);
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        #101419;
      background-size: 42px 42px;
    }
    .map {
      position: absolute;
      inset: 12px;
      border: 1px solid #27323e;
      border-radius: 8px;
      overflow: hidden;
    }
    .road, .river, .building, .zone, .entity, .aim, .label { position: absolute; }
    .road { background: #303943; border-radius: 999px; opacity: .85; }
    .r1 { width: 74%; height: 18px; left: 12%; top: 50%; transform: rotate(-8deg); }
    .r2 { width: 14px; height: 80%; left: 62%; top: 7%; transform: rotate(18deg); }
    .river { width: 30%; height: 120%; left: -4%; top: -10%; background: rgba(50, 108, 135, .35); transform: rotate(12deg); }
    .building {
      background: #262f38;
      border: 1px solid #3a4654;
      border-radius: 5px;
      opacity: .95;
    }
    .b1 { width: 170px; height: 96px; left: 35%; top: 22%; }
    .b2 { width: 132px; height: 78px; left: 68%; top: 58%; }
    .b3 { width: 104px; height: 120px; left: 18%; top: 62%; }
    .zone {
      border: 1px dashed rgba(255, 123, 69, .8);
      background: rgba(255, 123, 69, .08);
      border-radius: 8px;
    }
    .z1 { width: 200px; height: 105px; right: 6%; top: 12%; transform: rotate(-6deg); }
    .entity {
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      border: 2px solid #050708;
      box-shadow: 0 0 0 1px rgba(255,255,255,.25);
    }
    .local { background: var(--local); left: 48%; top: 54%; }
    .team { background: var(--team); left: 43%; top: 50%; }
    .pmc { background: var(--pmc); left: 70%; top: 36%; }
    .scav { background: var(--scav); left: 58%; top: 71%; }
    .boss { background: var(--boss); left: 28%; top: 31%; }
    .loot-dot { background: var(--loot); width: 9px; height: 9px; margin: -4px 0 0 -4px; }
    .valuable-dot { background: var(--valuable); width: 10px; height: 10px; margin: -5px 0 0 -5px; }
    .extract { background: var(--extract); width: 13px; height: 13px; border-radius: 2px; transform: rotate(45deg); }
    .hazard { background: var(--hazard); border-radius: 2px; transform: rotate(45deg); }
    .aim { height: 2px; transform-origin: left center; opacity: .8; }
    .aim.local-a { width: 90px; left: 48%; top: 54%; background: var(--local); transform: rotate(-22deg); }
    .aim.pmc-a { width: 70px; left: 70%; top: 36%; background: var(--pmc); transform: rotate(142deg); }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-shadow: 0 1px 2px #000;
      transform: translate(10px, -22px);
      white-space: nowrap;
    }
    .window {
      position: absolute;
      min-width: 220px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(26, 32, 39, .94);
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      overflow: hidden;
    }
    .window h2 {
      margin: 0;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }
    .window .body { padding: 10px; }
    .players { right: 20px; top: 20px; width: 390px; }
    .loot { right: 20px; bottom: 20px; width: 350px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.07); text-align: left; }
    th { color: #cdd7e2; background: rgba(255,255,255,.04); }
    td.num { text-align: right; color: #c6d0db; }
    .status {
      left: 20px;
      bottom: 20px;
      width: 260px;
    }
    .legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 12px;
      color: var(--muted);
    }
    .key { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .back {
      position: absolute;
      left: 12px;
      top: 40px;
      color: var(--muted);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav class="menu">
    <button id="modeButton">Map Follow</button>
    <span class="menu-link">Settings</span>
    <span class="menu-link">Web Radar</span>
    <span class="menu-link">Loot Filters</span>
    <span class="spacer"></span>
    <span id="rightText">Customs | 60 FPS</span>
  </nav>
  <main class="workspace">
    <a class="back" href="index.html">Back</a>
    <section class="map" aria-label="Mock radar map">
      <div class="river"></div><div class="road r1"></div><div class="road r2"></div>
      <div class="building b1"></div><div class="building b2"></div><div class="building b3"></div>
      <div class="zone z1"></div>
      <div class="aim local-a"></div><div class="aim pmc-a"></div>
      <div class="entity local"><span class="label">You</span></div>
      <div class="entity team"><span class="label">Teammate</span></div>
      <div class="entity pmc"><span class="label">PMC 83m</span></div>
      <div class="entity scav"><span class="label">Scav 47m</span></div>
      <div class="entity boss"><span class="label">Boss</span></div>
      <div class="entity valuable-dot" style="left:38%;top:34%"></div>
      <div class="entity valuable-dot" style="left:64%;top:62%"></div>
      <div class="entity loot-dot" style="left:52%;top:43%"></div>
      <div class="entity loot-dot" style="left:75%;top:70%"></div>
      <div class="entity extract" style="left:8%;top:82%"></div>
      <div class="entity extract" style="left:90%;top:18%"></div>
      <div class="entity hazard" style="left:84%;top:24%"></div>
    </section>
    <section class="window players">
      <h2>Player Info</h2>
      <div class="body">
        <table>
          <thead><tr><th>Name</th><th>Grp</th><th>In Hands</th><th>Value</th><th>Dist</th></tr></thead>
          <tbody>
            <tr><td style="color:var(--pmc)">Striker</td><td>A</td><td>M4A1</td><td class="num">244k</td><td class="num">83</td></tr>
            <tr><td style="color:var(--scav)">Scav</td><td>-</td><td>SKS</td><td class="num">38k</td><td class="num">47</td></tr>
            <tr><td style="color:var(--boss)">Reshala</td><td>B</td><td>AK-101</td><td class="num">317k</td><td class="num">122</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section class="window loot">
      <h2>Loot</h2>
      <div class="body">
        <table>
          <thead><tr><th>Name</th><th>Value</th><th>Dist</th></tr></thead>
          <tbody>
            <tr><td>GPU</td><td class="num">744k</td><td class="num">37</td></tr>
            <tr><td>LedX</td><td class="num">591k</td><td class="num">64</td></tr>
            <tr><td>Injector case</td><td class="num">311k</td><td class="num">91</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section class="window status">
      <h2>Legend</h2>
      <div class="body legend">
        <span class="key"><span class="swatch" style="background:var(--local)"></span>Local</span>
        <span class="key"><span class="swatch" style="background:var(--pmc)"></span>PMC</span>
        <span class="key"><span class="swatch" style="background:var(--scav)"></span>Scav</span>
        <span class="key"><span class="swatch" style="background:var(--valuable)"></span>Valuable</span>
        <span class="key"><span class="swatch" style="background:var(--extract);border-radius:2px"></span>Extract</span>
        <span class="key"><span class="swatch" style="background:var(--hazard);border-radius:2px"></span>Hazard</span>
      </div>
    </section>
  </main>
  <script>
    const button = document.getElementById("modeButton");
    button.addEventListener("click", () => {
      const free = button.textContent === "Map Follow";
      button.textContent = free ? "Map Free" : "Map Follow";
      button.classList.toggle("active", free);
    });
  </script>
</body>
</html>
